[project]
name = "whitney-codex-skills"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pyyaml>=6,<7",
    "ruff>=0.15,<0.16",
    "types-pyyaml>=6,<7",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "^skills/note-system/scripts/navigate\\.py$"
